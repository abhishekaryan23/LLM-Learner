name: Research inbox

# Weekly: gather new papers and lab posts (arXiv, Hugging Face Daily Papers, lab blogs),
# rank them against the course's module tags and commit research/inbox/<year>-W<week>.md.
# Nothing here touches the live site: a reviewer (or the weekly Claude session) reads the
# inbox, checks primary sources and publishes verified field notes (never lesson edits).
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build this week's inbox
        run: python tools/research/fetch_inbox.py
      - name: Commit it
        run: |
          git add research/inbox
          if git diff --cached --quiet; then echo "Inbox unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Research inbox $(date -u +%G-W%V)"
          git push
