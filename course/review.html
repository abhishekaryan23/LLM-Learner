<!doctype html>
<html lang="en" data-root="./" data-page="review">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review · LLMs, Animated</title>
<meta name="description" content="Your spaced-repetition review deck.">
<meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<link rel="stylesheet" href="assets/css/main.css">
<script>try{var t=JSON.parse(localStorage.getItem("llmc:v1:theme"));if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<div class="page">
<main class="review-wrap" id="main">
  <section id="review" aria-labelledby="rv">
    <p class="kicker">Spaced repetition</p>
    <h1 id="rv">Review</h1>
    <p class="lede">Cards from every lesson, shuffled together. Answer in your head, reveal, then grade yourself honestly.</p>
    <div class="review-stats"></div>
    <div id="review-stage"></div>
    <hr>
    <h2 style="margin-top:0;font-size:1.1rem">Move your progress</h2>
    <p class="math-note">Everything is saved only in this browser. Export a file to back it up or continue on another device.</p>
    <div class="row">
      <button type="button" class="btn" id="export">Export progress</button>
      <button type="button" class="btn" id="import">Import…</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </section>
</main>
</div>
<script src="assets/vendor/katex/katex.min.js"></script>
<script src="assets/vendor/katex/auto-render.min.js"></script>
<script src="assets/js/course-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/learn.js"></script>
<script src="assets/js/review.js"></script>
</body>
</html>
